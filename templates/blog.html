{% extends "base.html" %}

{% block content %}
<h1 class="title">
    {{ section.title }}
</h1>
<ul>
    <!-- If you are using pagination, sectiuon.pages will bee empty.
     You need to use the paginator object -->
     {% for page in section.pages %}
     <li>
        <h4>{{page.date}}</h4>
        <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    </li>
     {% endfor %}
</ul>
{% endblock content %}
